[package]
name = "astrocalc"
version = "0.1.0"
edition = "2024"

[dependencies]
astro = "2.0.0"
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.51", features = ["derive"] }
csv = "1.4.0"
diesel = { version = "2.3.3", features = ["sqlite", "chrono"] }
diesel_migrations = "2.3.2"
# Windows has no system sqlite3.lib by default; bundle SQLite into the binary.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
dotenvy = "0.15.7"
eframe = "0.33.0"
egui = "0.33.0"
egui-async = "0.2.3"
egui_extras = { version = "0.33.0", features = ["datepicker"] }
egui_plot = "0.34.0"
julian_day_converter = "0.4.5"
once_cell = "1.21.3"
open-meteo-rs = "0.0.4"
phf = { version = "0.13.1", features = ["macros", "phf_macros"] }
polars = { version = "0.51.0", features = [
    "cum_agg",
    "dtype-date",
    "lazy",
    "polars-ops",
    "dtype-datetime",
    "rows"
] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
suncalc = "0.4.0"
sunrise-sunset-calculator = "1.0.1"
tokio = "1.48.0"
tzf-rs = "1.1.0"
walkers = "0.48.0"
geojson = "0.24"
